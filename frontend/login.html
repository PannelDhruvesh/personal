<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04020f" /> 
  <title>Sign In — Its Billi</title>
  <link rel="preconnect" href="https://personal-awj6.onrender.com" />
  <link rel="preconnect" href="https://accounts.google.com" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/login.css" />
  <script src="https://accounts.google.com/gsi/client"></script>
</head>
<body style="background:#04020f;">
  <div id="app">
    <div class="auth-page" id="auth-page">

      <div class="galaxy-nebula galaxy-nebula-1"></div> 
      <div class="galaxy-nebula galaxy-nebula-2"></div>
      <div class="galaxy-nebula galaxy-nebula-3"></div>
      <div class="star-field" id="star-field"></div>

      <div class="auth-inner">

        <div class="auth-logo">
          <!--
            ══════════════════════════════════════════
            LOGO IMAGE — Apni photo/logo yahan lagao
            ══════════════════════════════════════════
            Option 1: Frontend folder mein image rakho
              → frontend/images/logo.png  (ya .jpg/.webp)
              → src ko "/images/logo.png" karo

            Option 2: Koi bhi online image URL use karo
              → src ko direct URL dedo

            Option 3: Default "IB" text dikhta rahe
              → Bas ye <img> tag comment mein hi rehne do

            ABHI: /images/logo.png use ho raha hai
            Agar image nahi milti toh "IB" fallback dikhega
            ══════════════════════════════════════════
          -->
          <div class="auth-logo-icon" id="logo-icon">
            <!-- Apni image yahan -->
            <img
              src="/images/logo_1.jpg"
              alt="Its Billi Logo"
              style="width:100%;height:100%;object-fit:cover;border-radius:20px;"
              onerror="this.style.display='none';document.getElementById('logo-text').style.display='block';"
            />
            <!-- Fallback text agar image nahi mili -->
            <span id="logo-text" style="display:none;font-size:18px;font-weight:900;color:white;">IB</span>
          </div>
          <h1 class="auth-logo-title">Its Billi</h1>
          <p class="auth-logo-sub">Your private memory space</p>
        </div>

        <div class="auth-card">
          <h2 class="auth-title">Welcome back</h2>
          <p class="auth-subtitle">Sign in to access your memories</p>

          <div id="form-message" class="form-message" style="display:none;"></div>

          <form id="login-form" class="auth-form" autocomplete="on" novalidate>
            <div class="input-group">
              <label class="input-label" for="email">Email</label>
              <div class="input-wrapper">
                <span class="input-icon" style="font-style:normal;font-size:13px;color:var(--purple-300);font-weight:600;">@</span>
                <input type="email" id="email" name="email" class="input-field"
                  placeholder="your@email.com" autocomplete="email" required />
              </div>
            </div>

            <div class="input-group">
              <label class="input-label" for="password">Password</label>
              <div class="input-wrapper">
                <span class="input-icon" style="font-style:normal;font-size:15px;color:var(--purple-300);font-weight:700;">&#9632;</span>
                <input type="password" id="password" name="password" class="input-field"
                  placeholder="Your password" autocomplete="current-password" required />
                <span class="input-icon-right" id="toggle-password"
                  style="font-size:11px;color:var(--purple-300);font-weight:700;letter-spacing:0.5px;">SHOW</span>
              </div>
            </div>

            <div style="text-align:right;margin-top:-8px;">
              <a href="/forgot-password.html" style="font-size:var(--text-sm);color:var(--purple-300);font-weight:500;">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Sign In</button>
          </form>

          <div class="auth-divider">or</div>

          <!-- Custom Google button matching app design -->
          <button id="google-btn" type="button" style="
            width:100%;padding:14px 16px;
            border-radius:var(--radius-lg);
            background:rgba(155,85,245,0.08);
            border:1.5px solid rgba(155,85,245,0.30);
            color:#ede8ff;
            font-size:15px;font-weight:600;
            display:flex;align-items:center;justify-content:center;gap:12px;
            cursor:pointer;transition:all 0.2s ease;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;"
            onmouseover="this.style.background='rgba(155,85,245,0.18)';this.style.borderColor='rgba(155,85,245,0.55)'"
            onmouseout="this.style.background='rgba(155,85,245,0.08)';this.style.borderColor='rgba(155,85,245,0.30)'">
            <svg width="20" height="20" viewBox="0 0 48 48" style="flex-shrink:0">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Continue with Google
          </button>
          <!-- Hidden GSI button (does the actual work) -->
          <div id="google-signin-btn" style="display:none;"></div>

          <div class="auth-footer" style="margin-top:var(--space-5);">
            Don't have an account? <a href="/register.html">Create one</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <style>
    /* Force Google button container to full width */
    #google-signin-btn { width: 100%; }
    #google-signin-btn > div { width: 100% !important; }
  </style>
  <script>
    // ── Stars ──
    (function() {
      var f = document.getElementById('star-field');
      for (var i = 0; i < 150; i++) {
        var s = document.createElement('div');
        s.className = 'star';
        var sz = (Math.random()*2.5+0.5).toFixed(1);
        var x  = (Math.random()*100).toFixed(1);
        var y  = (Math.random()*100).toFixed(1);
        var d  = (Math.random()*4+2).toFixed(1);
        var dl = (Math.random()*5).toFixed(1);
        var op = (Math.random()*.6+.2).toFixed(2);
        s.style.cssText = 'width:'+sz+'px;height:'+sz+'px;left:'+x+'%;top:'+y+'%;opacity:'+op+';--dur:'+d+'s;--delay:'+dl+'s;';
        f.appendChild(s);
      }
    })();

    // ── Custom bg ──
    const savedBg = localStorage.getItem('app_bg_image');
    if (savedBg) {
      const pg = document.getElementById('auth-page');
      pg.style.backgroundImage = `url(${savedBg})`;
      pg.classList.add('has-custom-bg');
    }

    // ── Google callback ──
    window.handleGoogleResponse = async function(credentialResponse) {
      showMsg('Signing in with Google...', 'info');
      try {
        const { api } = await import('./js/api.js');
        const res = await api.googleLogin(credentialResponse.credential);
        api.setTokens(res.data.access_token, res.data.refresh_token);
        // Store initial user from google response
        localStorage.setItem('user', JSON.stringify(res.data.user));
        // Fetch fresh profile to get current signed avatar URL
        try {
          const freshRes = await api.getMe();
          if (freshRes?.data) localStorage.setItem('user', JSON.stringify(freshRes.data));
        } catch (_) { /* non-fatal */ }
        window.location.replace('/dashboard.html');
      } catch(e) {
        showMsg(e.message || 'Google sign-in failed. Try email/password.', 'error');
      }
    };

    // ── Init Google button ──
    function initGoogleBtn() {
      var clientId = window.APP_CONFIG && window.APP_CONFIG.GOOGLE_CLIENT_ID;
      if (!clientId || typeof google === 'undefined') return;

      google.accounts.id.initialize({
        client_id: clientId,
        callback: handleGoogleResponse,
        auto_select: false,
        cancel_on_tap_outside: true,
      });

      // Render hidden GSI button (needed for callback to work)
      google.accounts.id.renderButton(
        document.getElementById('google-signin-btn'),
        { theme: 'filled_black', size: 'large', width: '360' }
      );

      // Wire our custom button to trigger GSI prompt
      var btn = document.getElementById('google-btn');
      if (btn) {
        btn.addEventListener('click', function() {
          google.accounts.id.prompt(function(notification) {
            if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
              // Fallback: click the hidden GSI button
              var gsiBtn = document.querySelector('#google-signin-btn div[role=button]');
              if (gsiBtn) gsiBtn.click();
            }
          });
        });
      }
    }

    // Run after page load
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGoogleBtn);
    } else {
      // Script is sync — run directly, but wait for google to be ready
      if (typeof google !== 'undefined') {
        initGoogleBtn();
      } else {
        window.addEventListener('load', initGoogleBtn);
      }
    }

    function showMsg(msg, type = 'error') {
      const el = document.getElementById('form-message');
      if (!el) return;
      el.textContent = msg;
      el.className = `form-message ${type}`;
      el.style.display = 'block';
    }
  </script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
