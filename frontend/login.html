<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04020f" />
  <title>Sign In — Its Billi</title>
  <link rel="preconnect" href="https://personal-awj6.onrender.com" />
  <link rel="preconnect" href="https://accounts.google.com" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/login.css" />
  <script src="https://accounts.google.com/gsi/client"></script>
</head>
<body style="background:#04020f;">
  <div id="app">
    <div class="auth-page" id="auth-page">

      <div class="galaxy-nebula galaxy-nebula-1"></div>
      <div class="galaxy-nebula galaxy-nebula-2"></div>
      <div class="galaxy-nebula galaxy-nebula-3"></div>
      <div class="star-field" id="star-field"></div>

      <div class="auth-inner">

        <div class="auth-logo">
          <div class="auth-logo-icon">IB</div>
          <h1 class="auth-logo-title">Its Billi</h1>
          <p class="auth-logo-sub">Your private memory space</p>
        </div>

        <div class="auth-card">
          <h2 class="auth-title">Welcome back</h2>
          <p class="auth-subtitle">Sign in to access your memories</p>

          <div id="form-message" class="form-message" style="display:none;"></div>

          <form id="login-form" class="auth-form" autocomplete="on" novalidate>
            <div class="input-group">
              <label class="input-label" for="email">Email</label>
              <div class="input-wrapper">
                <span class="input-icon" style="font-style:normal;font-size:13px;color:var(--purple-300);font-weight:600;">@</span>
                <input type="email" id="email" name="email" class="input-field"
                  placeholder="your@email.com" autocomplete="email" required />
              </div>
            </div>

            <div class="input-group">
              <label class="input-label" for="password">Password</label>
              <div class="input-wrapper">
                <span class="input-icon" style="font-style:normal;font-size:15px;color:var(--purple-300);font-weight:700;">&#9632;</span>
                <input type="password" id="password" name="password" class="input-field"
                  placeholder="Your password" autocomplete="current-password" required />
                <span class="input-icon-right" id="toggle-password"
                  style="font-size:11px;color:var(--purple-300);font-weight:700;letter-spacing:0.5px;">SHOW</span>
              </div>
            </div>

            <div style="text-align:right;margin-top:-8px;">
              <a href="/forgot-password.html" style="font-size:var(--text-sm);color:var(--purple-300);font-weight:500;">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Sign In</button>
          </form>

          <div class="auth-divider">or</div>

          <!-- Google button wrapper — styled to match app -->
          <div style="display:flex;justify-content:center;width:100%;">
            <div id="google-signin-btn"></div>
          </div>

          <div class="auth-footer" style="margin-top:var(--space-5);">
            Don't have an account? <a href="/register.html">Create one</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // ── Stars ──
    (function() {
      var f = document.getElementById('star-field');
      for (var i = 0; i < 150; i++) {
        var s = document.createElement('div');
        s.className = 'star';
        var sz = (Math.random()*2.5+0.5).toFixed(1);
        var x  = (Math.random()*100).toFixed(1);
        var y  = (Math.random()*100).toFixed(1);
        var d  = (Math.random()*4+2).toFixed(1);
        var dl = (Math.random()*5).toFixed(1);
        var op = (Math.random()*.6+.2).toFixed(2);
        s.style.cssText = 'width:'+sz+'px;height:'+sz+'px;left:'+x+'%;top:'+y+'%;opacity:'+op+';--dur:'+d+'s;--delay:'+dl+'s;';
        f.appendChild(s);
      }
    })();

    // ── Custom bg ──
    const savedBg = localStorage.getItem('app_bg_image');
    if (savedBg) {
      const pg = document.getElementById('auth-page');
      pg.style.backgroundImage = `url(${savedBg})`;
      pg.classList.add('has-custom-bg');
    }

    // ── Google callback ──
    window.handleGoogleResponse = async function(credentialResponse) {
      showMsg('Signing in with Google...', 'info');
      try {
        const { api } = await import('./js/api.js');
        const res = await api.googleLogin(credentialResponse.credential);
        api.setTokens(res.data.access_token, res.data.refresh_token);
        localStorage.setItem('user', JSON.stringify(res.data.user));
        window.location.replace('/dashboard.html');
      } catch(e) {
        showMsg(e.message || 'Google sign-in failed. Try email/password.', 'error');
      }
    };

    // ── Init Google button ──
    function initGoogleBtn() {
      const clientId = window.APP_CONFIG?.GOOGLE_CLIENT_ID;
      if (!clientId || typeof google === 'undefined') return;

      google.accounts.id.initialize({
        client_id: clientId,
        callback: handleGoogleResponse,
        auto_select: false,
        cancel_on_tap_outside: true,
      });

      // Render official Google button — most reliable cross-browser approach
      google.accounts.id.renderButton(
        document.getElementById('google-signin-btn'),
        {
          type: 'standard',
          theme: 'filled_black',
          size: 'large',
          text: 'signin_with',
          shape: 'rectangular',
          logo_alignment: 'left',
          width: '360',
        }
      );
    }

    // Run after page load
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGoogleBtn);
    } else {
      // Script is sync — run directly, but wait for google to be ready
      if (typeof google !== 'undefined') {
        initGoogleBtn();
      } else {
        window.addEventListener('load', initGoogleBtn);
      }
    }

    function showMsg(msg, type = 'error') {
      const el = document.getElementById('form-message');
      if (!el) return;
      el.textContent = msg;
      el.className = `form-message ${type}`;
      el.style.display = 'block';
    }
  </script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
