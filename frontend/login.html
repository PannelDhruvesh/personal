<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04020f" />
  <title>Sign In — Its Billi</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body style="background:#04020f;">
  <div id="app">
    <div class="auth-page" id="auth-page">

      <!-- Nebula clouds -->
      <div class="galaxy-nebula galaxy-nebula-1"></div>
      <div class="galaxy-nebula galaxy-nebula-2"></div>
      <div class="galaxy-nebula galaxy-nebula-3"></div>

      <!-- Star field -->
      <div class="star-field" id="star-field"></div>

      <!-- Content -->
      <div class="auth-inner">

        <!-- Logo -->
        <div class="auth-logo">
          <div class="auth-logo-icon">IB</div>
          <h1 class="auth-logo-title">Its Billi</h1>
          <p class="auth-logo-sub">Your private memory space</p>
        </div>

        <!-- Card -->
        <div class="auth-card">
          <h2 class="auth-title">Welcome back</h2>
          <p class="auth-subtitle">Sign in to access your memories</p>

          <div id="form-message" class="form-message" style="display:none;"></div>

          <form id="login-form" class="auth-form" autocomplete="on" novalidate>

            <div class="input-group">
              <label class="input-label" for="email">Email</label>
              <div class="input-wrapper">
                <span class="input-icon" style="font-style:normal;font-size:13px;color:var(--purple-300);font-weight:600;">@</span>
                <input type="email" id="email" name="email" class="input-field"
                  placeholder="your@email.com" autocomplete="email" required />
              </div>
            </div>

            <div class="input-group">
              <label class="input-label" for="password">Password</label>
              <div class="input-wrapper">
                <span class="input-icon" style="font-style:normal;font-size:15px;color:var(--purple-300);font-weight:700;">&#9632;</span>
                <input type="password" id="password" name="password" class="input-field"
                  placeholder="Your password" autocomplete="current-password" required />
                <span class="input-icon-right" id="toggle-password"
                  style="font-size:11px;color:var(--purple-300);font-weight:700;letter-spacing:0.5px;">SHOW</span>
              </div>
            </div>

            <div style="text-align:right;margin-top:-8px;">
              <a href="/forgot-password.html"
                style="font-size:var(--text-sm);color:var(--purple-300);font-weight:500;">
                Forgot password?
              </a>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="submit-btn">
              Sign In
            </button>

          </form>

          <div class="auth-divider">or</div>

          <div class="auth-footer">
            Don't have an account?
            <a href="/register.html">Create one</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // ── Generate star field ──
    (function() {
      const field = document.getElementById('star-field');
      const count = 180;
      for (let i = 0; i < count; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 2.5 + 0.5;
        const x = Math.random() * 100;
        const y = Math.random() * 100;
        const dur = (Math.random() * 4 + 2).toFixed(1);
        const delay = (Math.random() * 5).toFixed(1);
        const opacity = (Math.random() * 0.6 + 0.2).toFixed(2);
        star.style.cssText = `
          width:${size}px;height:${size}px;
          left:${x}%;top:${y}%;
          opacity:${opacity};
          --dur:${dur}s;--delay:${delay}s;
        `;
        field.appendChild(star);
      }

      // Shooting stars
      for (let i = 0; i < 4; i++) {
        const s = document.createElement('div');
        s.className = 'shooting-star';
        const top = Math.random() * 50;
        const left = Math.random() * 40;
        const dur = (Math.random() * 3 + 3).toFixed(1);
        const delay = (Math.random() * 10 + i * 3).toFixed(1);
        s.style.cssText = `top:${top}%;left:${left}%;--dur:${dur}s;--delay:${delay}s;`;
        field.appendChild(s);
      }
    })();

    // Apply custom bg if saved
    const savedBg = localStorage.getItem('app_bg_image');
    if (savedBg) {
      const page = document.getElementById('auth-page');
      page.style.backgroundImage = `url(${savedBg})`;
      page.classList.add('has-custom-bg');
    }
  </script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
