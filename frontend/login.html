<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080810" />
  <title>Sign In — Its Billi</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div id="app">
    <div class="auth-page" id="auth-page">
      <div class="auth-bg-orb"></div>
      <div class="auth-inner">

        <!-- Logo -->
        <div class="auth-logo">
          <div class="auth-logo-icon">IB</div>
          <h1 class="auth-logo-title">Its Billi</h1>
          <p class="auth-logo-sub">Your private memory space</p>
        </div>

        <!-- Card -->
        <div class="auth-card">
          <h2 class="auth-title">Welcome back</h2>
          <p class="auth-subtitle">Sign in to access your memories</p>

          <div id="form-message" class="form-message" style="display:none;"></div>

          <form id="login-form" class="auth-form" autocomplete="on" novalidate>

            <div class="input-group">
              <label class="input-label" for="email">Email</label>
              <div class="input-wrapper">
                <span class="input-icon" style="font-style:normal;font-size:14px;color:var(--purple-400);">@</span>
                <input type="email" id="email" name="email" class="input-field"
                  placeholder="your@email.com" autocomplete="email" required />
              </div>
            </div>

            <div class="input-group">
              <label class="input-label" for="password">Password</label>
              <div class="input-wrapper">
                <span class="input-icon" style="font-style:normal;font-size:14px;color:var(--purple-400);">*</span>
                <input type="password" id="password" name="password" class="input-field"
                  placeholder="Your password" autocomplete="current-password" required />
                <span class="input-icon-right" id="toggle-password" style="font-size:13px;color:var(--purple-400);font-weight:600;letter-spacing:1px;">SHOW</span>
              </div>
            </div>

            <div style="text-align:right;margin-top:-8px;">
              <a href="/forgot-password.html" style="font-size:var(--text-sm);color:var(--purple-400);font-weight:500;">
                Forgot password?
              </a>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="submit-btn">
              Sign In
            </button>

          </form>

          <div class="auth-divider">or</div>

          <div class="auth-footer">
            Don't have an account?
            <a href="/register.html">Create one</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script type="module" src="js/login.js"></script>
  <script>
    // Apply saved background on load
    const savedBg = localStorage.getItem('app_bg_image');
    if (savedBg) {
      document.getElementById('auth-page').style.backgroundImage = `url(${savedBg})`;
    }
  </script>
</body>
</html>
