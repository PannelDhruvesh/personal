<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04020f" />
  <title>Profile — Its Billi</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://personal-awj6.onrender.com" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/profile.css" />
</head>
<body>
  <div id="app" class="app-container">

    <!-- Server wake indicator -->
    <div id="server-wake-toast" style="display:none;position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(124,45,232,0.92);color:white;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:600;z-index:9999;backdrop-filter:blur(10px);gap:8px;align-items:center;white-space:nowrap;">
      <span style="width:12px;height:12px;border:2px solid rgba(255,255,255,0.4);border-top-color:white;border-radius:50%;display:inline-block;animation:spin 0.8s linear infinite;flex-shrink:0;"></span>
      Waking up server...
    </div>

    <main style="flex:1;min-height:0;padding-bottom:calc(var(--navbar-height) + var(--safe-bottom) + 16px);overflow-y:auto;-webkit-overflow-scrolling:touch;">

      <!-- Cover + Avatar -->
      <div class="profile-cover">
        <div style="position:absolute;top:16px;right:16px;padding-top:env(safe-area-inset-top,0);">
          <a href="/settings.html" style="width:40px;height:40px;background:rgba(255,255,255,0.15);border-radius:12px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);" aria-label="Settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white" opacity="0.9"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          </a>
        </div>
      </div>

      <div style="position:relative;padding:0 20px;">
        <div class="profile-avatar-wrap">
          <div id="profile-avatar" class="profile-avatar" style="display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:white;background:var(--gradient-primary);"></div>
          <label class="profile-avatar-edit" for="avatar-input" title="Change photo" style="font-size:16px;color:white;font-weight:700;">+</label>
          <input type="file" id="avatar-input" accept="image/*" style="display:none;" />
        </div>
        <div style="margin-top:52px;display:flex;justify-content:flex-end;">
          <button class="btn btn-secondary" id="edit-profile-btn" style="padding:10px 20px;font-size:13px;">Edit Profile</button>
        </div>
      </div>

      <div class="profile-info">
        <h1 class="profile-name" id="profile-name">Loading...</h1>
        <p class="profile-username" id="profile-username">@username</p>
        <p class="profile-bio" id="profile-bio"></p>
        <p style="font-size:12px;color:var(--dark-subtext);margin-top:8px;display:flex;align-items:center;gap:4px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0;"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v1.5l8 5 8-5V6H4zm0 3.5V18h16V9.5l-8 5-8-5z"/></svg>
          <span id="profile-storage">—</span>
        </p>
      </div>

      <!-- Stats -->
      <div class="profile-stats">
        <div class="profile-stat">
          <div class="profile-stat-value" id="stat-photos">—</div>
          <div class="profile-stat-label">Photos</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-value" id="stat-videos">—</div>
          <div class="profile-stat-label">Videos</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-value" id="stat-storage-pct">—</div>
          <div class="profile-stat-label">Used</div>
        </div>
      </div>

      <!-- Media section -->
      <p class="menu-section-title">Media</p>
      <div class="menu-list">
        <a href="/gallery.html" class="menu-item">
          <div class="menu-item-icon">
            <svg viewBox="0 0 24 24"><path d="M21 15l-5-5L11 15l-4-4-4 4V5h18v10zM3 19h18v2H3v-2zM5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3 4a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
          </div>
          <div class="menu-item-content"><div class="menu-item-label">Gallery</div><div class="menu-item-sub">All your memories</div></div>
          <span class="menu-item-arrow">›</span>
        </a>
        <a href="/gallery.html?filter=favorites" class="menu-item">
          <div class="menu-item-icon" style="background:rgba(248,113,113,0.12);">
            <svg viewBox="0 0 24 24" fill="#f87171"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </div>
          <div class="menu-item-content"><div class="menu-item-label">Favorites</div><div class="menu-item-sub">Your best memories</div></div>
          <span class="menu-item-arrow">›</span>
        </a>
        <a href="/gallery.html?trash=1" class="menu-item">
          <div class="menu-item-icon red">
            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
          </div>
          <div class="menu-item-content"><div class="menu-item-label">Trash</div><div class="menu-item-sub">Recently deleted</div></div>
          <span class="menu-item-arrow">›</span>
        </a>
      </div>

      <!-- Account section -->
      <p class="menu-section-title">Account</p>
      <div class="menu-list">
        <a href="/settings.html" class="menu-item">
          <div class="menu-item-icon purple">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          </div>
          <div class="menu-item-content"><div class="menu-item-label">Settings</div><div class="menu-item-sub">App preferences</div></div>
          <span class="menu-item-arrow">›</span>
        </a>
        <a href="/admin.html" class="menu-item" id="admin-panel-link" style="display:none;">
          <div class="menu-item-icon" style="background:rgba(155,85,245,0.18);">
            <svg viewBox="0 0 24 24" fill="var(--purple-400)"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4l5 2.18V11c0 3.5-2.33 6.79-5 7.93C9.33 17.79 7 14.5 7 11V7.18L12 5z"/></svg>
          </div>
          <div class="menu-item-content">
            <div class="menu-item-label" style="background:var(--gradient-primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">Admin Panel</div>
            <div class="menu-item-sub">Manage users &amp; activity</div>
          </div>
          <span class="menu-item-arrow">›</span>
        </a>
        <div class="menu-item" id="logout-btn" style="cursor:pointer;">
          <div class="menu-item-icon red">
            <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
          </div>
          <div class="menu-item-content"><div class="menu-item-label" style="color:#f87171;">Sign Out</div></div>
          <span class="menu-item-arrow">›</span>
        </div>
      </div>

    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="/dashboard.html" class="nav-item" aria-label="Home">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></span>
        <span class="nav-label">Home</span>
      </a>
      <a href="/albums.html" class="nav-item" aria-label="Albums">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/></svg></span>
        <span class="nav-label">Albums</span>
      </a>
      <a href="/upload.html" class="nav-item nav-fab" aria-label="Upload">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></span>
      </a>
      <a href="/gallery.html" class="nav-item" aria-label="Gallery">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M21 15l-5-5L11 15l-4-4-4 4V5h18v10zM3 19h18v2H3v-2zM5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3 4a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></span>
        <span class="nav-label">Gallery</span>
      </a>
      <a href="/profile.html" class="nav-item active" aria-label="Profile">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
        <span class="nav-label">Profile</span>
      </a>
    </nav>

    <!-- Edit Profile Modal -->
    <div id="edit-profile-modal" style="display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);align-items:flex-end;justify-content:center;">
      <div style="width:100%;max-width:430px;background:var(--dark-surface);border-radius:28px 28px 0 0;padding:24px 20px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0));border-top:1px solid var(--dark-border);">
        <div style="width:40px;height:4px;background:var(--dark-border);border-radius:2px;margin:0 auto 20px;"></div>
        <h3 style="font-size:18px;font-weight:700;margin-bottom:20px;">Edit Profile</h3>
        <form id="edit-profile-form" style="display:flex;flex-direction:column;gap:16px;">
          <div class="input-group">
            <label class="input-label">Display name</label>
            <input type="text" id="edit-name-input" class="input-field" placeholder="Your name" />
          </div>
          <div class="input-group">
            <label class="input-label">Bio</label>
            <textarea id="edit-bio-input" class="input-field" rows="3" placeholder="Write something about yourself..." style="resize:none;"></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Save Changes</button>
          <button type="button" class="btn btn-ghost btn-full" data-close-modal="edit-profile-modal">Cancel</button>
        </form>
      </div>
    </div>

  </div>

  <style>
    #edit-profile-modal.open { display:flex!important; }
    .menu-item-icon svg { width:20px; height:20px; fill:var(--purple-400); }
    .menu-item-icon.red svg { fill:#f87171; }
  </style>

  <script src="config.js"></script>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
