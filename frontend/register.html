<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04020f" />
  <title>Create Account — Its Billi</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/login.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body style="background:#04020f;">
  <div id="app">
    <div class="auth-page" id="auth-page">
      <div class="galaxy-nebula galaxy-nebula-1"></div>
      <div class="galaxy-nebula galaxy-nebula-2"></div>
      <div class="star-field" id="star-field"></div>
      <div class="auth-inner">

        <!-- Logo -->
        <div class="auth-logo">
          <div class="auth-logo-icon" style="font-size:18px;font-weight:900;">IB</div>
          <h1 class="auth-logo-title">Its Billi</h1>
          <p class="auth-logo-sub">Create your memory space</p>
        </div>

        <!-- Step 1: Register -->
        <div id="step-register" class="auth-card">
          <h2 class="auth-title">Create account</h2>
          <p class="auth-subtitle">Start saving your precious memories</p>

          <div id="form-message" class="form-message" style="display:none;"></div>

          <form id="register-form" class="auth-form" novalidate>

            <div class="input-group">
              <label class="input-label" for="display_name">Your name</label>
              <div class="input-wrapper">
                <span class="input-icon">🌸</span>
                <input type="text" id="display_name" name="display_name" class="input-field"
                  placeholder="Your display name" autocomplete="name" />
              </div>
            </div>

            <div class="input-group">
              <label class="input-label" for="username">Username</label>
              <div class="input-wrapper">
                <span class="input-icon">👤</span>
                <input type="text" id="username" name="username" class="input-field"
                  placeholder="username (letters, numbers, _)" autocomplete="username" required />
              </div>
            </div>

            <div class="input-group">
              <label class="input-label" for="email">Email</label>
              <div class="input-wrapper">
                <span class="input-icon">📧</span>
                <input type="email" id="email" name="email" class="input-field"
                  placeholder="your@email.com" autocomplete="email" required />
              </div>
            </div>

            <div class="input-group">
              <label class="input-label" for="password">Password</label>
              <div class="input-wrapper">
                <span class="input-icon">🔒</span>
                <input type="password" id="password" name="password" class="input-field"
                  placeholder="Min 8 chars, 1 uppercase, 1 number" autocomplete="new-password" required />
              </div>
              <div class="password-strength">
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
                <div class="strength-bar"></div>
              </div>
            </div>

            <div class="input-group">
              <label class="input-label" for="confirm_password">Confirm password</label>
              <div class="input-wrapper">
                <span class="input-icon">🔑</span>
                <input type="password" id="confirm_password" name="confirm_password" class="input-field"
                  placeholder="Repeat your password" autocomplete="new-password" required />
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="submit-btn">
              ✨ Create Account
            </button>

          </form>

          <div class="auth-footer">
            Already have an account?
            <a href="/login.html">Sign in</a>
          </div>

          <!-- Google Sign-Up BELOW the form -->
          <div class="auth-divider" style="margin-top:var(--space-4);">or</div>
          <button id="google-btn" type="button" style="width:100%;padding:13px;border-radius:var(--radius-lg);background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.14);color:var(--dark-text);font-size:var(--text-sm);font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
            Sign up with Google
          </button>
        </div>

        <!-- Step 2: Verify OTP -->
        <div id="step-verify" class="auth-card" style="display:none;">
          <h2 class="auth-title">Verify email 📧</h2>
          <p class="auth-subtitle">
            We sent a 6-digit code to<br/>
            <strong id="verify-email-hint" style="color:var(--pink-400)"></strong>
          </p>

          <div id="verify-message" class="form-message" style="display:none;"></div>

          <div class="otp-inputs">
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
          </div>

          <button class="btn btn-primary btn-full" id="verify-btn">✅ Verify</button>

          <div class="auth-footer" style="margin-top:16px;">
            Didn't receive it?
            <a href="#" id="resend-btn"> Resend code</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // Star field
    (function() {
      var f = document.getElementById('star-field');
      if (!f) return;
      for (var i = 0; i < 150; i++) {
        var s = document.createElement('div');
        s.className = 'star';
        var sz = (Math.random() * 2.5 + 0.5).toFixed(1);
        var x  = (Math.random() * 100).toFixed(1);
        var y  = (Math.random() * 100).toFixed(1);
        var d  = (Math.random() * 4 + 2).toFixed(1);
        var dl = (Math.random() * 5).toFixed(1);
        var op = (Math.random() * 0.6 + 0.2).toFixed(2);
        s.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;left:' + x + '%;top:' + y + '%;opacity:' + op + ';--dur:' + d + 's;--delay:' + dl + 's;';
        f.appendChild(s);
      }
    })();

    // Google button for register page
    document.getElementById('google-btn') && document.getElementById('google-btn').addEventListener('click', function() {
      var clientId = window.APP_CONFIG && window.APP_CONFIG.GOOGLE_CLIENT_ID;
      if (!clientId) { alert('Google Sign-In not configured.'); return; }
      if (typeof google === 'undefined') { alert('Google is loading, please try again.'); return; }
      google.accounts.id.initialize({
        client_id: clientId,
        callback: function(resp) {
          import('./js/api.js').then(function(m) {
            return m.api.googleLogin(resp.credential);
          }).then(function(res) {
            var a = res.data;
            localStorage.setItem('access_token', a.access_token);
            localStorage.setItem('refresh_token', a.refresh_token);
            localStorage.setItem('user', JSON.stringify(a.user));
            window.location.replace('/dashboard.html');
          }).catch(function(e) {
            alert('Google sign-in failed: ' + (e.message || e));
          });
        },
        auto_select: false
      });
      google.accounts.id.prompt();
    });
  </script>
  <script type="module" src="js/register.js"></script>
</body>
</html>
