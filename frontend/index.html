<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>Its Billi ❤️</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(ellipse 80% 60% at 50% 30%, #3d0e7a 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 70%, #5e1ab8 0%, transparent 55%),
        #04020f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    .splash { 
      max-width: 430px;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Background glow orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(60px);
    }
    .orb-1 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(124,45,232,0.45) 0%, transparent 70%);
      top: -80px; right: -60px;
      animation: float 7s ease-in-out infinite;
    }
    .orb-2 {
      width: 250px; height: 250px;
      background: radial-gradient(circle, rgba(90,26,184,0.35) 0%, transparent 70%);
      bottom: 50px; left: -60px;
      animation: float 9s ease-in-out infinite reverse;
    }
    .orb-3 {
      width: 180px; height: 180px;
      background: radial-gradient(circle, rgba(155,85,245,0.25) 0%, transparent 70%);
      bottom: 30%; right: 10%;
      animation: float 5s ease-in-out infinite 2s;
    }

    /* Logo */
    .splash-logo {
      position: relative;
      z-index: 2;
      text-align: center;
      animation: bounceIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .logo-icon { 
      width: 110px; 
      height: 110px; 
      background: linear-gradient(135deg, #9b55f5 0%, #5e1ab8 100%); 
      border-radius: 34px; 
      display: flex; 
      align-items: center; 
      justify-content: center;  
      margin: 0 auto 24px; 
      font-size: 54px; 
      box-shadow: 0 12px 48px rgba(124,45,232,0.55), 0 0 80px rgba(124,45,232,0.25); 
      animation: glowPulse 2.5s ease-in-out infinite 1s; 
    }

    .logo-title {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #9b55f5, #d0aaff, #7c2de8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      animation: glowText 2s ease-in-out infinite 1.5s;
    }

    .logo-tagline {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 1px;
      font-weight: 400;
      animation: fadeIn 0.8s ease 0.8s both;
    }

    /* Particles */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      font-size: 20px;
      animation: particleFloat linear infinite;
      opacity: 0;
    }

    /* ── Enter Button ── */
    .enter-btn-wrap {
      position: relative;
      z-index: 2;
      margin-top: 52px;
      animation: slideUp 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 1s both;
    }

    /* Outer glow ring that pulses */
    .enter-btn-wrap::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 999px;
      background: linear-gradient(135deg, #9b55f5, #c084fc, #5e1ab8, #9b55f5);
      background-size: 300% 300%;
      animation: rotateBorder 3s linear infinite, glowRing 2.5s ease-in-out infinite;
      z-index: -1;
      filter: blur(4px);
      opacity: 0.8;
    }

    .enter-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 17px 52px;
      background: linear-gradient(135deg, #9b55f5 0%, #6d28d9 50%, #5e1ab8 100%);
      background-size: 200% 200%;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow:
        0 0 0 1px rgba(155,85,245,0.4),
        0 8px 32px rgba(124,45,232,0.55),
        0 20px 60px rgba(94,26,184,0.3),
        inset 0 1px 0 rgba(255,255,255,0.15);
      animation: shimmerBg 4s ease infinite;
      transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1),
                  box-shadow 0.18s ease;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      white-space: nowrap;
    }

    /* Shine sweep on hover */
    .enter-btn::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent 0%,
        rgba(255,255,255,0.22) 50%,
        transparent 100%
      );
      transition: left 0.45s ease;
      pointer-events: none;
    }

    .enter-btn:hover::after { left: 160%; }

    .enter-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow:
        0 0 0 1px rgba(155,85,245,0.6),
        0 12px 40px rgba(124,45,232,0.7),
        0 28px 70px rgba(94,26,184,0.4),
        inset 0 1px 0 rgba(255,255,255,0.2);
    }

    .enter-btn:active {
      transform: scale(0.96);
      box-shadow:
        0 0 0 1px rgba(155,85,245,0.3),
        0 4px 16px rgba(124,45,232,0.4),
        inset 0 1px 0 rgba(255,255,255,0.1);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    /* Arrow icon inside button */
    .enter-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .enter-btn:hover .enter-arrow {
      transform: translateX(3px);
    }

    /* Hint text below button */
    .enter-hint {
      margin-top: 14px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.28);
      letter-spacing: 0.8px;
      text-align: center;
      font-weight: 500;
      animation: fadeIn 0.5s ease 1.8s both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes rotateBorder {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes glowRing {
      0%, 100% { opacity: 0.6; filter: blur(4px); }
      50%       { opacity: 1;   filter: blur(7px); }
    }

    @keyframes shimmerBg {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    @keyframes bounceIn {
      0%   { transform: scale(0.3);  opacity: 0; }
      50%  { transform: scale(1.08); opacity: 0.9; }
      70%  { transform: scale(0.96); }
      100% { transform: scale(1);    opacity: 1; }
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 12px 48px rgba(124,45,232,0.55), 0 0 80px rgba(124,45,232,0.25); }
      50%       { box-shadow: 0 12px 64px rgba(124,45,232,0.75), 0 0 100px rgba(124,45,232,0.4); }
    }

    @keyframes glowText {
      0%, 100% { filter: brightness(1); }
      50%       { filter: brightness(1.2) drop-shadow(0 0 12px rgba(155,85,245,0.6)); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes particleFloat {
      0%   { transform: translateY(0) rotate(0deg) scale(1);   opacity: 0.9; }
      100% { transform: translateY(-150px) rotate(540deg) scale(0.5); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="splash" id="splash">
    <!-- Background orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- Logo -->
    <div class="splash-logo">
      <div class="logo-icon">
        <img src="images/logo_1.jpg"
             alt="Its Billi"
             style="width:100%;height:100%;object-fit:cover;border-radius:30px;display:block;" />
      </div>
      <h1 class="logo-title">Its Billi</h1>
      <p class="logo-tagline">Your private memory space</p>
    </div>

    <!-- Enter button -->
    <div class="enter-btn-wrap">
      <button class="enter-btn" id="enter-btn" aria-label="Enter Its Billi">
        Enter
        <span class="enter-arrow" aria-hidden="true">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="white">
            <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
          </svg>
        </span>
      </button>
      <p class="enter-hint">Tap to continue</p>
    </div>
  </div>

  <script>
    // Spawn star particles
    const container = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.style.cssText = `
        position:absolute;
        width:${2 + Math.random()*3}px;
        height:${2 + Math.random()*3}px;
        border-radius:50%;
        background:rgba(${155+Math.random()*100},${85+Math.random()*80},255,${0.4+Math.random()*0.6});
        left:${Math.random()*100}%;
        bottom:${Math.random()*60}%;
        animation:particleFloat ${3+Math.random()*5}s linear infinite;
        animation-delay:${Math.random()*4}s;
        opacity:0;
      `;
      container.appendChild(p);
    }

    // Enter button → go to dashboard or login
    document.getElementById('enter-btn').addEventListener('click', () => {
      const token = localStorage.getItem('access_token');
      window.location.replace(token ? '/dashboard.html' : '/login.html');
    });
  </script>  
</body> 
</html>
