<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>Its Billi ❤️</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
    }

    .splash {
      max-width: 430px;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Background glow orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(60px);
    }
    .orb-1 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(233,30,140,0.35) 0%, transparent 70%);
      top: -80px; right: -60px;
      animation: float 7s ease-in-out infinite;
    }
    .orb-2 {
      width: 250px; height: 250px;
      background: radial-gradient(circle, rgba(124,58,237,0.30) 0%, transparent 70%);
      bottom: 50px; left: -60px;
      animation: float 9s ease-in-out infinite reverse;
    }
    .orb-3 {
      width: 180px; height: 180px;
      background: radial-gradient(circle, rgba(233,30,140,0.20) 0%, transparent 70%);
      bottom: 30%; right: 10%;
      animation: float 5s ease-in-out infinite 2s;
    }

    /* Logo */
    .splash-logo {
      position: relative;
      z-index: 2;
      text-align: center;
      animation: bounceIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .logo-icon {
      width: 110px;
      height: 110px;
      background: linear-gradient(135deg, #e91e8c 0%, #7c3aed 100%);
      border-radius: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 54px;
      box-shadow: 0 12px 48px rgba(233,30,140,0.55), 0 0 80px rgba(233,30,140,0.25);
      animation: glowPulse 2.5s ease-in-out infinite 1s;
    }

    .logo-title {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #e91e8c, #ff85bb, #9966ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      animation: glowText 2s ease-in-out infinite 1.5s;
    }

    .logo-tagline {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 1px;
      font-weight: 400;
      animation: fadeIn 0.8s ease 0.8s both;
    }

    /* Particles */
    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      font-size: 20px;
      animation: particleFloat linear infinite;
      opacity: 0;
    }

    /* Loading dots */
    .loading-dots {
      display: flex;
      gap: 8px;
      margin-top: 48px;
      position: relative;
      z-index: 2;
      animation: fadeIn 0.5s ease 1.2s both;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e91e8c, #7c3aed);
      animation: dotPulse 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    @keyframes bounceIn {
      0%   { transform: scale(0.3);  opacity: 0; }
      50%  { transform: scale(1.08); opacity: 0.9; }
      70%  { transform: scale(0.96); }
      100% { transform: scale(1);    opacity: 1; }
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 12px 48px rgba(233,30,140,0.55), 0 0 80px rgba(233,30,140,0.25); }
      50%       { box-shadow: 0 12px 64px rgba(233,30,140,0.75), 0 0 100px rgba(233,30,140,0.4); }
    }

    @keyframes glowText {
      0%, 100% { filter: brightness(1); }
      50%       { filter: brightness(1.2) drop-shadow(0 0 12px rgba(233,30,140,0.6)); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes particleFloat {
      0%   { transform: translateY(0) rotate(0deg) scale(1);   opacity: 0.9; }
      100% { transform: translateY(-150px) rotate(540deg) scale(0.5); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="splash" id="splash">
    <!-- Background orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- Logo -->
    <div class="splash-logo">
      <div class="logo-icon">❤️</div>
      <h1 class="logo-title">Its Billi</h1>
      <p class="logo-tagline">Your private memories ✨</p>
    </div>

    <!-- Loading indicator -->
    <div class="loading-dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    // Spawn heart particles
    const emojis = ['❤️','💕','🌸','✨','💖','🌺','💗','⭐','💝'];
    const container = document.getElementById('particles');
    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      p.style.left   = Math.random() * 100 + '%';
      p.style.bottom = Math.random() * 60 + '%';
      p.style.animationDuration = (3 + Math.random() * 5) + 's';
      p.style.animationDelay    = (Math.random() * 4) + 's';
      p.style.fontSize           = (14 + Math.random() * 16) + 'px';
      container.appendChild(p);
    }

    // Redirect after splash
    setTimeout(() => {
      const token = localStorage.getItem('access_token');
      window.location.replace(token ? '/dashboard.html' : '/login.html');
    }, 2400);
  </script>
</body>
</html>
