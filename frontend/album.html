<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>Album — Its Billi ❤️</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/gallery.css" />
  <link rel="stylesheet" href="css/nav.css" />
</head>
<body>
  <div id="app" class="app-container">

    <header class="topbar">
      <button class="btn btn-icon" onclick="history.back()">←</button>
      <div style="text-align:center;">
        <div class="topbar-title" id="album-name">Album</div>
        <div style="font-size:11px;color:var(--dark-subtext);" id="album-count">Loading...</div>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-icon" id="album-fav-btn" title="Favorite">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="fav-icon"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
        <button class="btn btn-icon" id="album-more-btn" title="More">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
      </div>
    </header>

    <main style="padding-top:calc(var(--topbar-height) + 8px);padding-bottom:calc(var(--navbar-height) + var(--safe-bottom) + 16px);">
      <div id="album-grid" class="media-grid grid-medium" style="padding:3px;"></div>
      <div id="scroll-sentinel" style="height:1px;"></div>
      <div id="load-spinner" style="display:none;justify-content:center;padding:32px;">
        <div style="width:32px;height:32px;border:3px solid rgba(233,30,140,0.3);border-top-color:var(--pink-500);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      </div>
    </main>

    <!-- FAB: upload to this album -->
    <a href="#" id="fab-upload" style="position:fixed;bottom:calc(var(--navbar-height) + var(--safe-bottom) + 12px);right:20px;width:56px;height:56px;background:var(--gradient-primary);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 20px rgba(124,45,232,0.5);z-index:150;text-decoration:none;color:white;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
    </a>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="/dashboard.html" class="nav-item" aria-label="Home">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </span>
        <span class="nav-label">Home</span>
      </a>
      <a href="/albums.html" class="nav-item active" aria-label="Albums">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/></svg>
        </span>
        <span class="nav-label">Albums</span>
      </a>
      <a href="/upload.html" class="nav-item nav-fab" aria-label="Upload">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </span>
      </a>
      <a href="/gallery.html" class="nav-item" aria-label="Gallery">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 15l-5-5L11 15l-4-4-4 4V5h18v10zM3 19h18v2H3v-2z"/></svg>
        </span>
        <span class="nav-label">Gallery</span>
      </a>
      <a href="/profile.html" class="nav-item" aria-label="Profile">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </span>
        <span class="nav-label">Profile</span>
      </a>
    </nav>

    <!-- More options sheet -->
    <div id="more-backdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:250;backdrop-filter:blur(6px);"></div>
    <div id="more-sheet" style="position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:430px;background:var(--dark-surface);border-radius:28px 28px 0 0;z-index:260;transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);border-top:1px solid var(--dark-border);padding:20px;">
      <div style="width:40px;height:4px;background:var(--dark-border);border-radius:2px;margin:0 auto 20px;"></div>
      <button class="btn btn-secondary btn-full" id="album-rename-btn" style="margin-bottom:10px;display:flex;align-items:center;gap:8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        Rename Album
      </button>
      <button class="btn btn-secondary btn-full" id="album-hide-btn" style="margin-bottom:10px;display:flex;align-items:center;gap:8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        Hide Album
      </button>
      <button class="btn btn-full" id="album-delete-btn" style="background:rgba(255,107,138,0.15);color:#ff6b8a;border:1px solid rgba(255,107,138,0.3);border-radius:999px;padding:14px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:center;gap:8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        Delete Album
      </button>
      <button class="btn btn-ghost btn-full" id="close-more">Cancel</button>
    </div>

  </div>

  <style>
    /* Page-specific styles */
    #album-fav-btn.active { color: var(--purple-400); }
    @keyframes spin { from { transform:rotate(0deg) } to { transform:rotate(360deg) } }
  </style>

  <script>
    const moreBtn = document.getElementById('album-more-btn');
    const moreSheet = document.getElementById('more-sheet');
    const moreBackdrop = document.getElementById('more-backdrop');
    const closeMore = document.getElementById('close-more');
    function openMore(){ moreSheet.style.transform='translateX(-50%) translateY(0)'; moreBackdrop.style.display='block'; }
    function closeMoreFn(){ moreSheet.style.transform='translateX(-50%) translateY(100%)'; moreBackdrop.style.display='none'; }
    moreBtn?.addEventListener('click', openMore);
    closeMore?.addEventListener('click', closeMoreFn);
    moreBackdrop?.addEventListener('click', closeMoreFn);

    // Set upload FAB href
    const p = new URLSearchParams(location.search);
    const albumId = p.get('id');
    document.getElementById('fab-upload').href = `/upload.html${albumId ? '?album_id='+albumId : ''}`;
  </script>

  <script src="config.js"></script>
  <script type="module" src="js/album.js"></script>
</body>
</html>
