<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>Upload — Its Billi ❤️</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/upload.css" />
</head>
<body>
  <div id="app" class="app-container">

    <!-- Global progress bar -->
    <div class="upload-progress-bar">
      <div class="upload-progress-bar-fill" id="global-progress-fill" style="width:0%;"></div>
    </div>

    <!-- Top bar -->
    <header class="topbar">
      <button class="btn btn-icon" onclick="history.back()">←</button>
      <span class="topbar-title">Upload</span>
      <div style="width:44px;"></div>
    </header>

    <main class="page-content" style="padding-top:76px;">

      <!-- Upload zone -->
      <div class="upload-zone" id="upload-zone">
        <input type="file" id="file-input" multiple
          accept="image/*,video/mp4,video/quicktime,video/webm,video/x-msvideo" />
        <div class="upload-zone-icon">📤</div>
        <p class="upload-zone-title">Drop files here</p>
        <p class="upload-zone-sub">or tap to browse<br/>Photos & Videos · Max 100MB each · Up to 20 files</p>
      </div>

      <!-- Album selector -->
      <div style="margin-top:16px;">
        <p class="input-label" style="margin-bottom:8px;">Save to album</p>
        <div class="album-selector" id="album-select">
          <div>
            <div class="album-selector-label">Album</div>
            <div class="album-selector-value" id="album-value">No Album</div>
          </div>
          <span style="color:var(--dark-muted);">›</span>
        </div>
      </div>

      <!-- File preview list -->
      <div style="margin-top:20px;" id="preview-section">
        <div id="preview-list"></div>
      </div>

      <!-- Upload button -->
      <div style="margin-top:24px;" id="upload-btn-section">
        <button class="btn btn-primary btn-full" id="upload-btn" disabled>
          🚀 Upload
        </button>
      </div>

    </main>

    <!-- Album picker bottom sheet -->
    <div id="album-sheet-backdrop"
      style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:250;backdrop-filter:blur(6px);"
      onclick="document.getElementById('album-sheet-backdrop').style.display='none';document.getElementById('album-sheet').classList.remove('open');"></div>

    <div id="album-sheet" style="position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:430px;background:var(--dark-surface);border-radius:28px 28px 0 0;z-index:260;transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);border-top:1px solid var(--dark-border);">
      <div style="padding:12px 20px 8px;">
        <div style="width:40px;height:4px;background:var(--dark-border);border-radius:2px;margin:0 auto 16px;"></div>
        <p style="font-weight:700;font-size:17px;color:var(--dark-text);margin-bottom:12px;">Choose Album</p>
        <button class="btn btn-primary btn-full" onclick="location.href='/album.html?new=1'" style="margin-bottom:12px;">+ Create New Album</button>
        <div id="album-sheet-list" style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-bottom:24px;"></div>
      </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="/dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
      <a href="/album.html"     class="nav-item"><span class="nav-icon">📁</span><span class="nav-label">Albums</span></a>
      <a href="/upload.html"    class="nav-item nav-fab active-fab"><span class="nav-fab-icon">+</span></a>
      <a href="/gallery.html"   class="nav-item"><span class="nav-icon">🖼️</span><span class="nav-label">Gallery</span></a>
      <a href="/profile.html"   class="nav-item"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></a>
    </nav>

  </div>

  <style>
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--app-max-width);height:calc(var(--navbar-height) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:rgba(13,13,13,0.92);backdrop-filter:blur(24px);border-top:1px solid var(--dark-border);display:flex;align-items:center;justify-content:space-around;z-index:var(--z-navbar);}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;padding:8px 0;text-decoration:none;color:var(--dark-muted);transition:var(--transition-base);}
    .nav-item.active{color:var(--pink-500);}
    .nav-icon{font-size:22px;}
    .nav-label{font-size:10px;font-weight:600;}
    .nav-fab{width:56px;height:56px;background:var(--gradient-primary);border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(233,30,140,0.5);margin-top:-16px;flex:0 0 56px;}
    .nav-fab-icon{font-size:28px;color:white;font-weight:300;line-height:1;}
    .nav-item:active{transform:scale(0.92);}
    .album-sheet.open{transform:translateX(-50%) translateY(0)!important;}
    #album-sheet.open + div, #album-sheet-backdrop{display:block!important;}
    .album-sheet-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;cursor:pointer;color:var(--dark-text);font-size:15px;font-weight:500;transition:background 0.15s;}
    .album-sheet-item:active{background:rgba(255,255,255,0.05);}
  </style>

  <script>
    // Show backdrop when sheet opens
    const sheet = document.getElementById('album-sheet');
    const backdrop = document.getElementById('album-sheet-backdrop');
    const observer = new MutationObserver(() => {
      backdrop.style.display = sheet.classList.contains('open') ? 'block' : 'none';
    });
    observer.observe(sheet, { attributes: true, attributeFilter: ['class'] });
  </script>

  <script src="config.js"></script>
  <script type="module" src="js/upload.js"></script>
</body>
</html>
