<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04020f" />
  <title>Upload — Its Billi</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/upload.css" />
  <link rel="stylesheet" href="css/nav.css" />
</head><body>
  <div id="app" class="app-container">

    <!-- Global progress bar -->
    <div class="upload-progress-bar">
      <div class="upload-progress-bar-fill" id="global-progress-fill" style="width:0%;"></div>
    </div>

    <!-- Top bar -->
    <header class="topbar">
      <button class="btn btn-icon" onclick="history.back()">←</button>
      <span class="topbar-title">Upload</span>
      <div style="width:44px;"></div>
    </header>

    <main class="page-content" style="padding-top:76px;padding-bottom:calc(140px + var(--safe-bottom));">

      <!-- Upload zone -->
      <div class="upload-zone" id="upload-zone">
        <input type="file" id="file-input" multiple
          accept="image/*,video/mp4,video/quicktime,video/webm,video/x-msvideo" />
        <div class="upload-zone-icon" style="font-size:40px;color:var(--purple-400);font-weight:900;">+</div>
        <p class="upload-zone-title">Drop files here</p>
        <p class="upload-zone-sub">or tap to browse<br/>Photos &amp; Videos · Max 100MB · Up to 20 files</p>
      </div>

      <!-- Album selector -->
      <div style="margin-top:16px;">
        <p class="input-label" style="margin-bottom:8px;">Save to album</p>
        <div class="album-selector" id="album-select">
          <div>
            <div class="album-selector-label">Album</div>
            <div class="album-selector-value" id="album-value">No Album</div>
          </div>
          <span style="color:var(--dark-muted);">›</span>
        </div>
      </div>

      <!-- File preview list -->
      <div style="margin-top:20px;" id="preview-section">
        <div id="preview-list"></div>
      </div>

    </main>

    <!-- Upload button — fixed above bottom nav, always visible -->
    <div style="position:fixed;bottom:calc(var(--navbar-height) + var(--safe-bottom) + 12px);left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:calc(var(--app-max-width) - 32px);z-index:var(--z-sticky);">
      <button class="btn btn-primary btn-full" id="upload-btn" disabled style="box-shadow:0 4px 24px rgba(124,45,232,0.45);">
        Upload
      </button>
    </div>

    <!-- Album picker bottom sheet -->
    <div id="album-sheet-backdrop"
      style="visibility:hidden;opacity:0;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:250;transition:opacity 0.2s,visibility 0.2s;"
      onclick="closeSheet();"></div>

    <div id="album-sheet" style="position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:430px;background:var(--dark-surface);border-radius:28px 28px 0 0;z-index:260;transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);border-top:1px solid var(--dark-border);">
      <div style="padding:12px 20px 8px;">
        <div style="width:40px;height:4px;background:var(--dark-border);border-radius:2px;margin:0 auto 16px;"></div>
        <p style="font-weight:700;font-size:17px;color:var(--dark-text);margin-bottom:12px;">Choose Album</p>
        <button class="btn btn-primary btn-full" onclick="location.href='/album.html?new=1'" style="margin-bottom:12px;">+ Create New Album</button>
        <div id="album-sheet-list" style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-bottom:24px;"></div>
      </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="/dashboard.html" class="nav-item" aria-label="Home">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></span>
        <span class="nav-label">Home</span>
      </a>
      <a href="/albums.html" class="nav-item" aria-label="Albums">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/></svg></span>
        <span class="nav-label">Albums</span>
      </a>
      <a href="/upload.html" class="nav-item nav-fab" aria-label="Upload">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></span>
      </a>
      <a href="/gallery.html" class="nav-item" aria-label="Gallery">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M21 15l-5-5L11 15l-4-4-4 4V5h18v10zM3 19h18v2H3v-2z"/></svg></span>
        <span class="nav-label">Gallery</span>
      </a>
      <a href="/profile.html" class="nav-item" aria-label="Profile">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
        <span class="nav-label">Profile</span>
      </a>
    </nav>

  </div>

  <script>
    function openSheet() {
      document.getElementById('album-sheet').style.transform = 'translateX(-50%) translateY(0)';
      const b = document.getElementById('album-sheet-backdrop');
      b.style.visibility = 'visible';
      b.style.opacity = '1';
    }
    function closeSheet() {
      document.getElementById('album-sheet').style.transform = 'translateX(-50%) translateY(100%)';
      const b = document.getElementById('album-sheet-backdrop');
      b.style.opacity = '0';
      setTimeout(() => b.style.visibility = 'hidden', 200);
    }
    window.closeAlbumSheet = closeSheet;
  </script>

  <script src="config.js"></script>
  <script type="module" src="js/upload.js"></script>
</body>
</html>
