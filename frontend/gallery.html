<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>Gallery — Its Billi ❤️</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/gallery.css" />
</head>
<body>
  <div id="app" class="app-container">

    <!-- Top bar -->
    <header class="topbar" style="flex-direction:column;height:auto;padding:12px 16px 8px;">
      <div style="display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:10px;">
        <span class="topbar-title">Gallery</span>
        <div style="display:flex;gap:8px;">
          <button data-grid="small"  class="btn btn-icon" title="Small grid">⊞</button>
          <button data-grid="medium" class="btn btn-icon active" title="Medium grid">⊟</button>
          <button data-grid="large"  class="btn btn-icon" title="Large grid">▣</button>
        </div>
      </div>
      <!-- Search -->
      <div class="input-wrapper" style="width:100%;">
        <span class="input-icon">🔍</span>
        <input type="search" id="search-input" class="input-field"
          placeholder="Search memories..." style="padding-left:44px;" />
      </div>
    </header>

    <main style="padding-top:114px;padding-bottom:calc(72px + var(--safe-bottom));">
      <!-- Filter chips -->
      <div class="gallery-toolbar" style="border-bottom:none;padding:10px 16px 6px;">
        <div class="filter-chips">
          <div class="chip active" data-filter="all">All</div>
          <div class="chip" data-filter="photos">📸 Photos</div>
          <div class="chip" data-filter="videos">🎬 Videos</div>
          <div class="chip" data-filter="favorites">❤️ Favorites</div>
        </div>
      </div>

      <!-- Media grid -->
      <div id="media-grid" class="media-grid grid-medium"></div>

      <!-- Infinite scroll sentinel -->
      <div id="scroll-sentinel" style="height:1px;"></div>

      <!-- Loading spinner -->
      <div id="load-spinner" style="display:none;justify-content:center;padding:32px;">
        <div style="width:32px;height:32px;border:3px solid rgba(233,30,140,0.3);border-top-color:var(--pink-500);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="/dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
      <a href="/album.html"     class="nav-item"><span class="nav-icon">📁</span><span class="nav-label">Albums</span></a>
      <a href="/upload.html"    class="nav-item nav-fab"><span class="nav-fab-icon">+</span></a>
      <a href="/gallery.html"   class="nav-item active"><span class="nav-icon">🖼️</span><span class="nav-label">Gallery</span></a>
      <a href="/profile.html"   class="nav-item"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></a>
    </nav>

  </div>

  <style>
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--app-max-width);height:calc(var(--navbar-height) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:rgba(13,13,13,0.92);backdrop-filter:blur(24px);border-top:1px solid var(--dark-border);display:flex;align-items:center;justify-content:space-around;z-index:var(--z-navbar);}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;padding:8px 0;text-decoration:none;color:var(--dark-muted);transition:var(--transition-base);}
    .nav-item.active{color:var(--pink-500);}
    .nav-icon{font-size:22px;}
    .nav-label{font-size:10px;font-weight:600;}
    .nav-fab{width:56px;height:56px;background:var(--gradient-primary);border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(233,30,140,0.5);margin-top:-16px;flex:0 0 56px;}
    .nav-fab-icon{font-size:28px;color:white;font-weight:300;line-height:1;}
    .nav-item:active{transform:scale(0.92);}
    [data-grid].active{background:var(--gradient-primary);color:white;border-color:transparent;}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  </style>

  <script src="config.js"></script>
  <script type="module" src="js/gallery.js"></script>
</body>
</html>
