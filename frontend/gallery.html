<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04020f" />
  <title>Gallery — Its Billi</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://personal-awj6.onrender.com" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/gallery.css" />
</head>
<body>
  <div id="app" class="app-container">

    <!-- Top bar -->
    <header class="topbar" style="flex-direction:column;height:auto;padding:12px 16px 8px;">
      <div style="display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:10px;">
        <span class="topbar-title">Gallery</span>
        <div style="display:flex;gap:8px;">
          <button data-grid="small"  class="btn btn-icon" title="Small grid" style="font-size:16px;">&#8862;</button>
          <button data-grid="medium" class="btn btn-icon active" title="Medium grid" style="font-size:16px;">&#8863;</button>
          <button data-grid="large"  class="btn btn-icon" title="Large grid" style="font-size:16px;">&#9635;</button>
        </div>
      </div>
      <!-- Search -->
      <div class="input-wrapper" style="width:100%;">
        <span class="input-icon" style="font-size:14px;">&#9906;</span>
        <input type="search" id="search-input" class="input-field"
          placeholder="Search memories..." style="padding-left:44px;" />
      </div>
    </header>

    <main style="padding-top:114px;padding-bottom:calc(72px + var(--safe-bottom));">
      <!-- Filter chips -->
      <div class="gallery-toolbar" style="border-bottom:none;padding:10px 16px 6px;">
        <div class="filter-chips">
          <div class="chip active" data-filter="all">All</div>
          <div class="chip" data-filter="photos">Photos</div>
          <div class="chip" data-filter="videos">Videos</div>
          <div class="chip" data-filter="favorites">Favorites</div>
        </div>
      </div>

      <!-- Media grid -->
      <div id="media-grid" class="media-grid grid-medium"></div>

      <!-- Infinite scroll sentinel -->
      <div id="scroll-sentinel" style="height:1px;"></div>

      <!-- Loading spinner -->
      <div id="load-spinner" style="display:none;justify-content:center;padding:32px;">
        <div style="width:32px;height:32px;border:3px solid rgba(155,85,245,0.3);border-top-color:var(--purple-400);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      </div>
    </main>

    <!-- Bottom Nav (SVG icons) -->
    <nav class="bottom-nav">
      <a href="/dashboard.html" class="nav-item" aria-label="Home">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></span>
        <span class="nav-label">Home</span>
      </a>
      <a href="/albums.html" class="nav-item" aria-label="Albums">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/></svg></span>
        <span class="nav-label">Albums</span>
      </a>
      <a href="/upload.html" class="nav-item nav-fab" aria-label="Upload">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></span>
      </a>
      <a href="/gallery.html" class="nav-item active" aria-label="Gallery">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M21 15l-5-5L11 15l-4-4-4 4V5h18v10zM3 19h18v2H3v-2z"/></svg></span>
        <span class="nav-label">Gallery</span>
      </a>
      <a href="/profile.html" class="nav-item" aria-label="Profile">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
        <span class="nav-label">Profile</span>
      </a>
    </nav>

  </div>

  <style>
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    [data-grid].active{background:var(--gradient-primary);color:white;border-color:transparent;}
    .nav-icon svg{width:22px;height:22px;fill:currentColor;}
  </style>

  <script src="config.js"></script>
  <script type="module" src="js/gallery.js"></script>
</body>
</html>
