<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d0d" />
  <title>Forgot Password — Its Billi ❤️</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div id="app">
    <div class="auth-page">
      <div class="auth-inner">

        <div class="auth-logo">
          <div class="auth-logo-icon" id="logo-icon">
            <img
              src="/images/logo_1.jpg"
              alt="Its Billi"
              style="width:100%;height:100%;object-fit:cover;border-radius:20px;"
              onerror="this.style.display='none';"
            />
          </div>
          <h1 class="auth-logo-title">Its Billi</h1>
          <p class="auth-logo-sub">Reset your password</p>
        </div>

        <!-- Step 1: Enter email -->
        <div id="step-email" class="auth-card">
          <h2 class="auth-title">Forgot password?</h2>
          <p class="auth-subtitle">Enter your email and we'll send a reset code</p>
          <div id="msg-1" class="form-message" style="display:none;"></div>
          <form id="forgot-form" class="auth-form">
            <div class="input-group">
              <label class="input-label" for="email">Email</label>
              <div class="input-wrapper">
                <span class="input-icon">📧</span>
                <input type="email" id="email" class="input-field" placeholder="your@email.com" required />
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="send-btn">Send Reset Code</button>
          </form>
          <div class="auth-footer"><a href="/login.html">← Back to sign in</a></div>
        </div>

        <!-- Step 2: OTP + new password -->
        <div id="step-reset" class="auth-card" style="display:none;">
          <h2 class="auth-title">Reset password 🔑</h2>
          <p class="auth-subtitle">Enter the code sent to your email and your new password</p>
          <div id="msg-2" class="form-message" style="display:none;"></div>

          <div class="otp-inputs" style="margin-bottom:20px;">
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
            <input class="otp-input" type="text" inputmode="numeric" maxlength="1" />
          </div>

          <div class="auth-form" style="display:flex;flex-direction:column;gap:16px;">
            <div class="input-group">
              <label class="input-label">New password</label>
              <div class="input-wrapper">
                <span class="input-icon">🔒</span>
                <input type="password" id="new-password" class="input-field" placeholder="New password" />
              </div>
            </div>
            <div class="input-group">
              <label class="input-label">Confirm password</label>
              <div class="input-wrapper">
                <span class="input-icon">🔑</span>
                <input type="password" id="confirm-password" class="input-field" placeholder="Confirm password" />
              </div>
            </div>
            <button class="btn btn-primary btn-full" id="reset-btn">Reset Password</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script type="module">
    import { api } from './js/api.js';
    import { toast } from './js/toast.js';
    import { redirectIfAuth } from './js/auth.js';
    redirectIfAuth();

    let userEmail = '';

    // Send OTP
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('send-btn');
      btn.disabled = true; btn.textContent = 'Sending...';
      try {
        await api.forgotPassword(email);
        userEmail = email;
        document.getElementById('step-email').style.display = 'none';
        document.getElementById('step-reset').style.display = 'block';
        initOtp();
      } catch (_) {
        const msg = document.getElementById('msg-1');
        msg.textContent = 'Something went wrong. Try again.';
        msg.className = 'form-message error'; msg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Send Reset Code';
      }
    });

    function initOtp() {
      const inputs = document.querySelectorAll('.otp-input');
      inputs.forEach((input, idx) => {
        input.addEventListener('input', (e) => {
          const val = e.target.value.replace(/\D/g, '');
          e.target.value = val.slice(-1);
          if (val && idx < inputs.length - 1) inputs[idx + 1].focus();
          if (val) e.target.classList.add('filled'); else e.target.classList.remove('filled');
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !input.value && idx > 0) {
            inputs[idx - 1].focus(); inputs[idx - 1].value = '';
            inputs[idx - 1].classList.remove('filled');
          }
        });
      });
    }

    document.getElementById('reset-btn').addEventListener('click', async () => {
      const inputs = document.querySelectorAll('.otp-input');
      const otp = Array.from(inputs).map(i => i.value).join('');
      const newPwd = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;
      const msg = document.getElementById('msg-2');

      if (otp.length !== 6) { msg.textContent = 'Enter 6-digit code.'; msg.className = 'form-message error'; msg.style.display = 'block'; return; }
      if (newPwd !== confirm) { msg.textContent = 'Passwords do not match.'; msg.className = 'form-message error'; msg.style.display = 'block'; return; }

      const btn = document.getElementById('reset-btn');
      btn.disabled = true; btn.textContent = 'Resetting...';

      try {
        await api.resetPassword({ email: userEmail, otp_code: otp, new_password: newPwd });
        toast.success('Password reset! Please sign in.');
        setTimeout(() => location.replace('/login.html'), 1200);
      } catch (err) {
        msg.textContent = err.message || 'Invalid code. Try again.';
        msg.className = 'form-message error'; msg.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
