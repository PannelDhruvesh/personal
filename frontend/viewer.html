<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>View — Its Billi</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/gallery.css" />
  <style>
    body { background:#000; overflow:hidden; }
    #app { max-width:430px; margin:0 auto; height:100vh; height:100dvh; position:relative; background:#000; }
    .viewer-svg-btn {
      width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,0.12);
      border:none;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;
      flex-shrink:0;
    }
    .viewer-svg-btn svg { width:20px;height:20px;fill:currentColor; }
  </style>
</head>
<body>
  <div id="app">

    <!-- Top bar -->
    <div style="position:absolute;top:0;left:0;right:0;z-index:10;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,0.75) 0%,transparent 100%);">
      <button id="viewer-back-btn" class="viewer-svg-btn" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div style="text-align:center;flex:1;margin:0 12px;">
        <p id="viewer-title" style="color:white;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;margin:0 auto;"></p>
        <p id="viewer-date" style="color:rgba(255,255,255,0.6);font-size:11px;margin-top:2px;"></p>
      </div>
      <button id="viewer-fav-btn" class="viewer-svg-btn" aria-label="Favorite">
        <!-- icon swapped by JS: outline heart = not fav, filled = fav -->
        <svg id="fav-icon-outline" viewBox="0 0 24 24"><path d="M16.5 3C14.76 3 13.09 3.81 12 5.09 10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg>
        <svg id="fav-icon-filled" viewBox="0 0 24 24" style="display:none;"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#f87171"/></svg>
      </button>
    </div>

    <!-- Media area -->
    <div id="viewer-media" style="width:100%;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;"></div>

    <!-- Bottom actions -->
    <div style="position:absolute;bottom:0;left:0;right:0;z-index:10;padding:20px 16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(0,0,0,0.75) 0%,transparent 100%);display:flex;align-items:center;justify-content:space-around;">
      <button class="viewer-action-btn" id="viewer-download-btn">
        <span class="icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        </span>
        <span>Download</span>
      </button>
      <button class="viewer-action-btn" id="viewer-share-btn">
        <span class="icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
        </span>
        <span>Share</span>
      </button>
      <button class="viewer-action-btn" id="viewer-info-btn">
        <span class="icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        </span>
        <span id="viewer-size"></span>
      </button>
      <button class="viewer-action-btn" id="viewer-delete-btn" style="color:rgba(255,107,138,0.9);">
        <span class="icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="rgba(255,107,138,0.9)"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        </span>
        <span>Trash</span>
      </button>
    </div>

  </div>

  <script src="config.js"></script>
  <script type="module" src="js/viewer.js"></script>
</body>
</html>
