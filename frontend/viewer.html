<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>View — Its Billi ❤️</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/gallery.css" />
  <script type="module" src="js/speed-insights.js"></script>
  <style>
    body { background:#000; overflow:hidden; }
    #app { max-width:430px; margin:0 auto; height:100vh; height:100dvh; position:relative; background:#000; }
  </style>
</head>
<body>
  <div id="app">

    <!-- Top bar -->
    <div style="position:absolute;top:0;left:0;right:0;z-index:10;padding:16px 16px;padding-top:calc(16px + env(safe-area-inset-top, 0px));display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,0.75) 0%,transparent 100%);">
      <button id="viewer-back-btn" style="width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,0.12);border:none;color:white;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;">←</button>
      <div style="text-align:center;flex:1;margin:0 12px;">
        <p id="viewer-title" style="color:white;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;margin:0 auto;"></p>
        <p id="viewer-date" style="color:rgba(255,255,255,0.6);font-size:11px;margin-top:2px;"></p>
      </div>
      <button id="viewer-fav-btn" style="width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,0.12);border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;">🤍</button>
    </div>

    <!-- Media area -->
    <div id="viewer-media" style="width:100%;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;"></div>

    <!-- Bottom actions -->
    <div style="position:absolute;bottom:0;left:0;right:0;z-index:10;padding:20px 16px;padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:linear-gradient(to top,rgba(0,0,0,0.75) 0%,transparent 100%);display:flex;align-items:center;justify-content:space-around;">
      <button class="viewer-action-btn" id="viewer-download-btn">
        <span class="icon">📥</span>
        <span>Download</span>
      </button>
      <button class="viewer-action-btn" id="viewer-share-btn">
        <span class="icon">🔗</span>
        <span>Share</span>
      </button>
      <button class="viewer-action-btn" id="viewer-info-btn">
        <span class="icon">ℹ️</span>
        <span id="viewer-size"></span>
      </button>
      <button class="viewer-action-btn" id="viewer-delete-btn" style="color:rgba(255,107,138,0.9);">
        <span class="icon">🗑️</span>
        <span>Trash</span>
      </button>
    </div>

  </div>

  <script src="config.js"></script>
  <script type="module" src="js/viewer.js"></script>
</body>
</html>
