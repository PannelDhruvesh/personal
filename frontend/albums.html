<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04020f" />
  <title>Albums — Its Billi</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://personal-awj6.onrender.com" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <script type="module" src="js/speed-insights.js"></script>
</head>
<body>
  <div id="app" class="app-container">

    <header class="topbar">
      <span class="topbar-title">Albums</span>
      <button class="btn btn-icon" id="new-album-btn" title="New Album" style="font-size:22px;font-weight:300;">+</button>
    </header>

    <!-- Server wake indicator -->
    <div id="server-wake-toast" style="display:none;position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(124,45,232,0.92);color:white;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:600;z-index:9999;backdrop-filter:blur(10px);gap:8px;align-items:center;white-space:nowrap;">
      <span style="width:12px;height:12px;border:2px solid rgba(255,255,255,0.4);border-top-color:white;border-radius:50%;display:inline-block;animation:spin 0.8s linear infinite;flex-shrink:0;"></span>
      Waking up server...
    </div>

    <main style="padding-top:calc(var(--topbar-height) + 8px);padding-bottom:calc(var(--navbar-height) + var(--safe-bottom) + 16px);">
      <!-- Filter chips — no emojis -->
      <div style="display:flex;gap:8px;padding:12px 16px 8px;overflow-x:auto;scrollbar-width:none;">
        <div class="chip active" data-tab="all">All</div>
        <div class="chip" data-tab="favorites">Favorites</div>
        <div class="chip" data-tab="hidden">Hidden</div>
        <div class="chip" data-tab="trash">Trash</div>
      </div>

      <!-- Albums grid -->
      <div id="albums-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px;"></div>

      <div id="scroll-sentinel" style="height:1px;"></div>
      <div id="load-spinner" style="display:none;justify-content:center;padding:24px;">
        <div style="width:28px;height:28px;border:3px solid rgba(155,85,245,0.3);border-top-color:var(--purple-400);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="/dashboard.html" class="nav-item" aria-label="Home">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></span>
        <span class="nav-label">Home</span>
      </a>
      <a href="/albums.html" class="nav-item active" aria-label="Albums">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/></svg></span>
        <span class="nav-label">Albums</span>
      </a>
      <a href="/upload.html" class="nav-item nav-fab" aria-label="Upload">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></span>
      </a>
      <a href="/gallery.html" class="nav-item" aria-label="Gallery">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M21 15l-5-5L11 15l-4-4-4 4V5h18v10zM3 19h18v2H3v-2z"/></svg></span>
        <span class="nav-label">Gallery</span>
      </a>
      <a href="/profile.html" class="nav-item" aria-label="Profile">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
        <span class="nav-label">Profile</span>
      </a>
    </nav>

    <!-- New Album modal -->
    <div id="new-album-modal" style="display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);align-items:flex-end;justify-content:center;">
      <div style="width:100%;max-width:430px;background:var(--dark-surface);border-radius:28px 28px 0 0;padding:24px 20px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0));border-top:1px solid var(--dark-border);">
        <div style="width:40px;height:4px;background:var(--dark-border);border-radius:2px;margin:0 auto 20px;"></div>
        <h3 style="font-size:18px;font-weight:700;margin-bottom:20px;">New Album</h3>
        <form id="new-album-form" style="display:flex;flex-direction:column;gap:16px;">
          <div class="input-group">
            <label class="input-label">Album name</label>
            <input type="text" id="album-name-input" class="input-field" placeholder="e.g. Summer 2025" required />
          </div>
          <div class="input-group">
            <label class="input-label">Description (optional)</label>
            <input type="text" id="album-desc-input" class="input-field" placeholder="A short description" />
          </div>
          <button type="submit" class="btn btn-primary btn-full">Create Album</button>
          <button type="button" class="btn btn-ghost btn-full" id="close-new-album">Cancel</button>
        </form>
      </div>
    </div>

  </div>

  <style>
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    #new-album-modal.open{display:flex!important;}
    .album-card{background:var(--dark-card);border:1px solid var(--dark-border);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform 0.2s;}
    .album-card:active{transform:scale(0.96);}
    .album-thumb{width:100%;aspect-ratio:1;background:var(--dark-surface);display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .album-thumb img{width:100%;height:100%;object-fit:cover;}
    .album-info{padding:12px;}
    .album-name{font-size:14px;font-weight:600;color:var(--dark-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .album-meta{font-size:11px;color:var(--dark-subtext);margin-top:2px;}
    .fav-badge{position:absolute;top:8px;right:8px;color:var(--purple-300);font-size:16px;}
    .chip{flex-shrink:0;padding:8px 16px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(155,85,245,0.08);border:1.5px solid rgba(155,85,245,0.15);color:var(--dark-subtext);cursor:pointer;transition:0.2s;white-space:nowrap;}
    .chip.active{background:var(--gradient-primary);border-color:transparent;color:white;}
  </style>

  <script src="config.js"></script>
  <script type="module">
    import { api } from './js/api.js';
    import { requireAuth } from './js/auth.js';
    import { toast } from './js/toast.js';
    const __authOk = await requireAuth();
    if (!__authOk) throw new Error('unauthenticated');

    let page = 1, hasMore = true, loading = false, currentTab = 'all';
    const grid = document.getElementById('albums-grid');

    async function load(reset=false) {
      if (loading || (!hasMore && !reset)) return;
      if (reset) { page=1; hasMore=true; grid.innerHTML = skeletons(4); }
      loading = true;
      try {
        let res;
        if (currentTab === 'trash') {
          res = await api.getAlbumTrash({ page, limit:20 });
        } else {
          res = await api.getAlbums({ page, limit:20, include_hidden: currentTab==='hidden' });
        }
        const albums = res.data;
        const pag = res.pagination;
        if (reset) grid.innerHTML = '';
        if (!albums?.length && reset) {
          grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:48px 0;">
            <div style="font-size:48px;margin-bottom:12px;opacity:0.4;">&#9632;</div>
            <p style="color:var(--dark-text);font-weight:600;font-size:16px;">No albums yet</p>
            <p style="color:var(--dark-subtext);font-size:13px;margin-top:4px;">Create one to organize your memories</p>
          </div>`;
          return;
        }
        let filtered = albums;
        if (currentTab === 'favorites') filtered = albums.filter(a=>a.is_favorite);
        filtered.forEach(a => grid.appendChild(albumCard(a)));
        hasMore = pag?.has_next||false;
        page++;
      } catch(_){ toast.error('Failed to load albums'); }
      finally { loading=false; document.getElementById('load-spinner').style.display='none'; }
    }

    function albumCard(a) {
      const div = document.createElement('div');
      div.className = 'album-card';
      div.style.position = 'relative';
      const name = a.name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      div.innerHTML = `
        <div class="album-thumb">
          ${a.cover_url ? `<img src="${a.cover_url}" alt="${name}" />` : '<span style="font-size:32px;color:var(--purple-400);opacity:0.5;">&#9632;</span>'}
        </div>
        ${a.is_favorite ? '<span class="fav-badge">&#9733;</span>' : ''}
        <div class="album-info">
          <div class="album-name">${name}</div>
          <div class="album-meta">${parseInt(a.file_count)||0} items</div>
        </div>`;
      div.addEventListener('click', () => location.href=`/album.html?id=${encodeURIComponent(a.id)}`);
      return div;
    }

    function skeletons(n) {
      return Array(n).fill(`<div class="skeleton" style="height:170px;border-radius:18px;"></div>`).join('');
    }

    document.querySelectorAll('[data-tab]').forEach(c => {
      c.addEventListener('click', () => {
        document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));
        c.classList.add('active');
        currentTab = c.dataset.tab;
        load(true);
      });
    });

    document.getElementById('new-album-btn').addEventListener('click',()=>document.getElementById('new-album-modal').classList.add('open'));
    document.getElementById('close-new-album').addEventListener('click',()=>document.getElementById('new-album-modal').classList.remove('open'));
    document.getElementById('new-album-form').addEventListener('submit', async e => {
      e.preventDefault();
      const name = document.getElementById('album-name-input').value.trim();
      const description = document.getElementById('album-desc-input').value.trim();
      if (!name) return;
      try {
        await api.createAlbum({ name, description: description||undefined });
        document.getElementById('new-album-modal').classList.remove('open');
        toast.success('Album created!');
        load(true);
        e.target.reset();
      } catch(err){ toast.error(err.message||'Failed'); }
    });

    new IntersectionObserver(entries=>{if(entries[0].isIntersecting)load();},{rootMargin:'200px'}).observe(document.getElementById('scroll-sentinel'));
    load(true);
  </script>
</body>
</html>
